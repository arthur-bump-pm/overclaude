name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}

jobs:
  test:
    name: shellcheck + test suite + payload check (macOS)
    runs-on: macos-latest
    # A stuck/queued macOS job fails cleanly instead of hanging the publish.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tooling
        run: |
          command -v jq >/dev/null || brew install jq
          command -v shellcheck >/dev/null || brew install shellcheck

      - name: shellcheck (errors)
        run: |
          shellcheck -S error bin/swap-guard hooks/*.sh statusline/statusline-command.sh \
            install.sh uninstall.sh doctor.sh sync.sh scrub.sh tests/*.sh

      - name: Test suite (macOS /bin/bash 3.2 — what users' `env bash` usually resolves to)
        run: PATH=/bin:/usr/bin:$PATH /bin/bash tests/run.sh

      - name: Test suite (bash 5)
        run: bash tests/run.sh

      - name: Wheel carries the full payload
        run: |
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir dist/ >/dev/null
          whl=$(ls dist/*.whl)
          for f in install.sh uninstall.sh doctor.sh bin/swap-guard bin/overclaude-install-transaction bin/overclaude-checkpoint bin/overclaude-codex-continue bin/overclaude-codex-probe bin/overclaude-codex-pool hooks/handoff-inject.sh \
                   hooks/ctx-watch.sh hooks/ctx-notify.sh statusline/statusline-command.sh \
                   skills/swap/SKILL.md skills/handoff/SKILL.md skills/checkpoint/SKILL.md claude/ULTRACODE.md \
                   settings/settings-fragment.json shell/zshrc-snippet.sh vendor/claude-swap/pyproject.toml \
                   bin/overclaude_runtime/tomli/_parser.py bin/overclaude_runtime/tomli/LICENSE; do
            unzip -l "$whl" | grep -q "overclaude/payload/$f" || { echo "payload missing: $f"; exit 1; }
          done
          unzip -l "$whl" | grep -q "overclaude/verify.py" || { echo "verifier missing"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/overclaude-wheel"
          "$RUNNER_TEMP/overclaude-wheel/bin/pip" install --quiet --no-deps "$whl"
          "$RUNNER_TEMP/overclaude-wheel/bin/python" -c 'from overclaude.verify import verify; from overclaude.cli import _payload_dir; assert callable(verify); print(_payload_dir())'
          echo "payload complete"
